name: PyPI package check

# Manual only. Builds an sdist and a wheel, then runs twine check and the
# layout script. It does not upload to TestPyPI or PyPI, does not create
# tokens, and does not request id-token: write. Publishing is a separate
# owner decision. See docs/PYPI.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Check package layout
        run: python scripts/check_package_layout.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
