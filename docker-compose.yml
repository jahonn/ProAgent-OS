services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROAGENT_ADMIN_KEY: ${PROAGENT_ADMIN_KEY:-dev-admin-key}
      PROAGENT_DB_PATH: /app/data/proagent.db
      PROAGENT_RATE_LIMIT_ENABLED: ${PROAGENT_RATE_LIMIT_ENABLED:-true}
      PROAGENT_RATE_LIMIT_REQUESTS: ${PROAGENT_RATE_LIMIT_REQUESTS:-120}
      PROAGENT_RATE_LIMIT_WINDOW_SECONDS: ${PROAGENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      PROAGENT_LLM_PROVIDER: ${PROAGENT_LLM_PROVIDER:-mock}
      PROAGENT_LLM_BASE_URL: ${PROAGENT_LLM_BASE_URL:-}
      PROAGENT_LLM_API_KEY: ${PROAGENT_LLM_API_KEY:-}
      PROAGENT_LLM_MODEL: ${PROAGENT_LLM_MODEL:-gpt-4o-mini}
      PROAGENT_EXECUTOR_MODE: ${PROAGENT_EXECUTOR_MODE:-noop}
      PROAGENT_EXECUTOR_ON_APPROVE: ${PROAGENT_EXECUTOR_ON_APPROVE:-true}
      PROAGENT_EXECUTOR_WEBHOOK_URL: ${PROAGENT_EXECUTOR_WEBHOOK_URL:-}
      PROAGENT_EXECUTOR_WEBHOOK_TIMEOUT_S: ${PROAGENT_EXECUTOR_WEBHOOK_TIMEOUT_S:-5}
      PROAGENT_EXECUTOR_WEBHOOK_TOKEN: ${PROAGENT_EXECUTOR_WEBHOOK_TOKEN:-}
      PROAGENT_OTEL_ENABLED: ${PROAGENT_OTEL_ENABLED:-false}
      PROAGENT_OTEL_EXPORTER: ${PROAGENT_OTEL_EXPORTER:-console}
      PROAGENT_OTEL_EXPORTER_OTLP_ENDPOINT: ${PROAGENT_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PROAGENT_OTEL_SERVICE_NAME: ${PROAGENT_OTEL_SERVICE_NAME:-proagent-os}
      PROAGENT_SKILLS_DIRS: /app/skills,/app/verticals/example/skills,/app/verticals/support_desk/skills
      PROAGENT_AGENTS_CONFIG: /app/config/agents.yaml
    volumes:
      - proagent-data:/app/data
    command: uvicorn proagent_os.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    environment:
      PROAGENT_ADMIN_KEY: ${PROAGENT_ADMIN_KEY:-dev-admin-key}
      PROAGENT_DB_PATH: /app/data/proagent.db
      PROAGENT_LLM_PROVIDER: ${PROAGENT_LLM_PROVIDER:-mock}
      PROAGENT_LLM_BASE_URL: ${PROAGENT_LLM_BASE_URL:-}
      PROAGENT_LLM_API_KEY: ${PROAGENT_LLM_API_KEY:-}
      PROAGENT_LLM_MODEL: ${PROAGENT_LLM_MODEL:-gpt-4o-mini}
      PROAGENT_EXECUTOR_MODE: ${PROAGENT_EXECUTOR_MODE:-noop}
      PROAGENT_EXECUTOR_ON_APPROVE: ${PROAGENT_EXECUTOR_ON_APPROVE:-true}
      PROAGENT_EXECUTOR_WEBHOOK_URL: ${PROAGENT_EXECUTOR_WEBHOOK_URL:-}
      PROAGENT_EXECUTOR_WEBHOOK_TIMEOUT_S: ${PROAGENT_EXECUTOR_WEBHOOK_TIMEOUT_S:-5}
      PROAGENT_EXECUTOR_WEBHOOK_TOKEN: ${PROAGENT_EXECUTOR_WEBHOOK_TOKEN:-}
      PROAGENT_OTEL_ENABLED: ${PROAGENT_OTEL_ENABLED:-false}
      PROAGENT_OTEL_EXPORTER: ${PROAGENT_OTEL_EXPORTER:-console}
      PROAGENT_OTEL_EXPORTER_OTLP_ENDPOINT: ${PROAGENT_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PROAGENT_OTEL_SERVICE_NAME: ${PROAGENT_OTEL_SERVICE_NAME:-proagent-os}
      PROAGENT_SKILLS_DIRS: /app/skills,/app/verticals/example/skills,/app/verticals/support_desk/skills
      PROAGENT_AGENTS_CONFIG: /app/config/agents.yaml
    volumes:
      - proagent-data:/app/data
    command: python -m proagent_os.worker
    depends_on:
      api:
        condition: service_healthy

volumes:
  proagent-data:
