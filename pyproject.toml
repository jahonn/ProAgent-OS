[project]
name = "proagent-os"
version = "0.1.0"
description = "Commercial-ready vertical-agnostic Pro-Agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "aiosqlite>=0.20.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
# Optional sqlite-vec vec0 index. Imported only when
# PROAGENT_KB_VECTOR_STORE=sqlite_vec. BM25 and the default blob store do not
# import it. pgvector is not a dependency.
vec = ["sqlite-vec>=0.1.9"]
# Optional OpenTelemetry SDK. Imported only when PROAGENT_OTEL_ENABLED=true.
# The default install and CI do not install this extra.
otel = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "sqlite_vec: needs the optional sqlite-vec extension (skipped when it cannot load)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proagent_os*"]
